name: Bug report / 缺陷报告
description: Report a reproducible defect with synthetic SIP or a loopback test.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        English or 简体中文 is welcome. Never attach real Authorization, credentials,
        subscriber data, message bodies, complete config or raw packet captures.
  - type: input
    id: revision
    attributes:
      label: Maintained revision
      description: Exact commit and effective original-module Replace entry.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and transport
      description: Go/OS/architecture and relevant UDP/TCP/TLS/WS conditions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Include chunk boundaries or transaction steps when relevant; no real SIP dumps.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include sanitized errors, test commands and cleanup observations.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed real credentials, subscriber data, message bodies and raw captures.
          required: true
        - label: I will report a vulnerability through the private security channel.
          required: true
